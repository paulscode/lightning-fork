syntax = "proto3";

package bridgerpc;

option go_package = "github.com/lightningnetwork/lnd/lnrpc/bridgerpc";

/*
 * Comments in this file will be directly parsed into the API
 * Documentation as descriptions of the associated method, message, or field.
 * These descriptions should go right above the definition of the object, and
 * can be in either block or // comment format.
 *
 * An RPC method can be matched to an lncli command by placing a line in the
 * beginning of the description in exactly the following format:
 * lncli: `methodname`
 *
 * Failure to specify the exact name of the command will cause documentation
 * generation to fail.
 *
 * More information on how exactly the gRPC documentation is generated from
 * this proto file can be found here:
 * https://github.com/lightninglabs/lightning-api
 */

// Bridge swaps payments between Lightning on this chain and Lightning on
// Bitcoin, atomically: both legs share one payment hash, so the bridge cannot
// take the incoming funds without having delivered the outgoing ones.
//
// The service is small on purpose. Asking for a quote commits this node's own
// liquidity, so these methods are for the operator and whoever they choose to
// expose them to, not for the public.
service Bridge {
    /* lncli: `bridge quote`
    Quote asks what a swap would cost and creates the hold invoice to pay for
    it. Which direction the swap runs is worked out by asking both nodes to
    decode the invoice, not by reading its prefix here.

    A quote reserves nothing until the returned hold invoice is paid, but it
    does fix a rate until expires_at.
    */
    rpc Quote (QuoteRequest) returns (QuoteResponse);

    /* lncli: `bridge swap`
    LookupSwap reports what the bridge believes about a swap it has quoted,
    including the preimage once there is one, which is the payer's proof that
    the destination was paid.
    */
    rpc LookupSwap (LookupSwapRequest) returns (Swap);

    /* lncli: `bridge status`
    Status reports whether this node is in a position to serve swaps: which
    directions are enabled, whether both chains can be measured, whether a
    usable price is available, and how many swaps are in flight.

    It answers while the bridge is refusing everything, which is the case it
    exists for.
    */
    rpc Status (StatusRequest) returns (StatusResponse);

    /* lncli: `bridge info`
    Info reports what the bridge would charge now, per direction, without
    creating or reserving anything. It is the call a payer makes to show a
    price before the user commits, so it is safe to hand to participants.
    */
    rpc Info (InfoRequest) returns (InfoResponse);

    /* lncli: `bridge setrate`
    SetRate changes the rate the bridge trades at, without a restart. The rate
    is kept across restarts and stamped with when it was set; once it is older
    than the configured limit the bridge refuses to quote until it is set
    again, because a rate nobody has looked at in a moving market is a loss
    waiting to be taken.
    */
    rpc SetRate (SetRateRequest) returns (SetRateResponse);

    /* lncli: `bridge sha256seed`
    ExportSha256Seed shows how to restore the SHA256 node this node runs for
    the bridge, outside Lightning Fork: a 24-word aezeed phrase and the
    equivalent BIP32 root key. Neither is stored anywhere; both are derived
    from this node's own wallet, so the operator's one recovery phrase is
    enough. Only for a supervised node, and only for an admin macaroon.
    */
    rpc ExportSha256Seed (ExportSha256SeedRequest)
        returns (ExportSha256SeedResponse);
}

message QuoteRequest {
    /*
    The payment request the payer wants delivered, on whichever chain it is
    for. It is never rewritten: its payment hash is what the hold invoice is
    built on, and settling requires that exact preimage.
    */
    string invoice = 1;
}

message QuoteResponse {
    /*
    What the payer pays, on the other chain. It is a hold invoice and does not
    settle until the bridge has delivered, which is the whole mechanism.
    */
    string hold_invoice = 1;

    // The payment hash both legs share, and the key to ask about this swap.
    bytes hash = 2;

    /*
    What the payer owes. Note that incoming and outgoing are in different
    units: a millisatoshi on one chain is not a millisatoshi on the other.
    */
    uint64 incoming_msat = 3;

    // What the destination receives.
    uint64 outgoing_msat = 4;

    // Outgoing units per incoming unit.
    double rate = 5;

    // The fraction charged on top of the rate.
    double spread = 6;

    /*
    The incoming leg's required CLTV, in blocks of the incoming chain. It is
    sized in wall-clock by the margin policy and converted, so it is usually
    far larger than a same-chain invoice would ask for.
    */
    uint32 cltv_delta = 7;

    // Which way this swap runs, for a payer deciding which node to pay from.
    string direction = 8;

    /*
    The deadline for paying hold_invoice, as a Unix timestamp in seconds. Pay
    it before this and the swap proceeds at the quoted rate; leave it and the
    bridge cancels the hold invoice, after which paying it fails.

    It applies only while the invoice is unpaid. Once the incoming HTLC is
    locked in the swap is no longer racing a clock in minutes, and cltv_delta
    is what bounds it.
    */
    int64 expires_at = 9;
}

message LookupSwapRequest {
    // The payment hash the quote returned.
    bytes hash = 1;
}

message Swap {
    bytes hash = 1;

    // What the bridge believes this swap is doing.
    string state = 2;

    uint64 incoming_msat = 3;
    uint64 outgoing_msat = 4;

    /*
    Present once there is one. It is the payer's proof that the destination was
    paid, and the value that claims the incoming hold invoice.
    */
    bytes preimage = 5;
}

message StatusRequest {
}

message StatusResponse {
    // Whether the operator has turned the bridge on.
    bool enabled = 1;

    /*
    The directions this node will currently quote. A direction disappears from
    here when it is disabled or when the node on that side cannot be reached.
    */
    repeated string directions = 2;

    /*
    Why the bridge is refusing to quote, if it is. Empty when it is serving.
    This is the field to read first: a bridge with no liquidity, an unsynced
    node or a stale price refuses every swap, and the reason belongs here
    rather than in a log.
    */
    repeated string refusals = 3;

    // How many swaps are being driven right now.
    uint32 swaps_in_flight = 4;

    // The rate in force, as SHA256 coin per BLAKE2b coin.
    double rate = 5;

    // When it was set, as a Unix timestamp in seconds.
    int64 rate_set_at = 6;

    /*
    When it stops being used, as a Unix timestamp in seconds, or zero if the
    bridge allows a rate of any age.
    */
    int64 rate_expires_at = 7;

    /*
    Swaps that need the operator: ones that ended lost (paid out and the
    claim on the money coming in could not be settled) or that the bridge
    stopped driving because it must not decide them alone. Each is the
    payment hash, the state and why. The bridge keeps quoting; these are for
    a person to look at.
    */
    repeated string needs_operator = 8;

    /*
    The Lightning node on the SHA256 chain: how far it has got and what it
    holds. Present whenever the bridge is enabled, including while it cannot
    start, since that node is usually why.
    */
    Sha256Node sha256_node = 9;
}

message Sha256Node {
    /*
    supervised when this node runs it for the bridge, external when it is a
    node the operator already ran.
    */
    string mode = 1;

    /*
    Where that node is, as a stable code: starting, creating_wallet, locked,
    syncing, ready, unreachable, not_ours or error.
    */
    string state = 2;

    // The same in a sentence, including what to do about it.
    string detail = 3;

    // Its identity key, hex, and the addresses it can be reached at.
    string identity_pubkey = 4;
    repeated string uris = 5;

    bool synced_to_chain = 6;
    uint32 block_height = 7;

    // Its on-chain wallet: what can be spent now, and what is still
    // confirming.
    int64 onchain_confirmed_sat = 8;
    int64 onchain_unconfirmed_sat = 9;

    uint32 active_channels = 10;
    uint32 inactive_channels = 11;
    uint32 pending_channels = 12;

    /*
    What its channels could send and receive now, in millisatoshis. Sending
    is what the bridge pays out with on the SHA256 chain.
    */
    uint64 outbound_msat = 13;
    uint64 inbound_msat = 14;

    uint32 peers = 15;

    // The lnd version it runs.
    string version = 16;
}

message ExportSha256SeedRequest {
}

message ExportSha256SeedResponse {
    /*
    The 24-word aezeed phrase, with no passphrase. Each call salts it afresh,
    so the words differ from call to call; every one restores the same node.
    */
    repeated string mnemonic = 1;

    // The same seed as a BIP32 root key (xprv on mainnet), which
    // `lncli create` also accepts.
    string extended_master_key = 2;

    // The wallet birthday, as a Unix timestamp: where a restore rescans from.
    int64 birthday = 3;

    // The identity key a node restored from either will have, hex.
    string identity_pubkey = 4;

    // How the seed is derived, so it can be checked without this code.
    string derivation = 5;
}

message InfoRequest {
}

message DirectionInfo {
    // toSHA256 or toBLAKE2b.
    string name = 1;

    // Whether a quote in this direction could succeed right now.
    bool open = 2;

    // Why not, when it could not: a stable code and a sentence.
    string refusal_code = 3;
    string refusal = 4;

    // Outgoing units per incoming unit. For toSHA256, SHA256 coin per BLAKE2b
    // coin.
    double rate = 5;

    // When the rate was set, as a Unix timestamp in seconds.
    int64 rate_set_at = 6;

    /*
    The fraction charged on top of the rate at the bridge's current position.
    It can move between this call and a quote.
    */
    double spread = 7;

    // Bounds on the invoice to be paid, in the outgoing chain's millisatoshis.
    uint64 min_msat = 8;
    uint64 max_msat = 9;
}

message InfoResponse {
    // The version of the payer API this bridge speaks.
    uint32 version = 1;

    /*
    This node's key. Every hold invoice the bridge issues on this chain is
    payable to exactly this key.
    */
    string node = 2;

    // One entry per enabled direction.
    repeated DirectionInfo directions = 3;
}

message SetRateRequest {
    // The new rate, as SHA256 coin per BLAKE2b coin.
    double rate = 1;
}

message SetRateResponse {
    // The rate now in force and when it was set, as a Unix timestamp.
    double rate = 1;
    int64 rate_set_at = 2;
}
